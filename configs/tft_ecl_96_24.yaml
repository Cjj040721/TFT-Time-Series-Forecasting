# ── TFT on ECL, seq=96, pred=24  (Table 12) ───────────────────────────────────
# ECL: 321 features (MT_000 … MT_320), target = MT_320, hourly

model: tft
dataset: ECL
data_path: data/raw/ECL/ECL.csv
target: MT_320
freq: h

seq_len: 96
label_len: 48
pred_len: 24

d_model: 32
n_heads: 4
lstm_layers: 2
dropout: 0.1

# Small batch + reduced d_model due to large feature dimension (321 vars)
batch_size: 8
epochs: 50
patience: 8
lr: 0.0005
seed: 42

n_features: 321
n_time_features: 4   # month day_of_week day_of_month hour

anomaly_window: 48
anomaly_lam: 3.0
inverse_scale: False
