# ── TFT on ETTh1, seq=168, pred=48 ─────────────────────────────────────────

model: tft
dataset: ETTh1
data_path: data/raw/ETT/ETTh1.csv
target: OT
freq: h

seq_len: 168
label_len: 48
pred_len: 48

d_model: 128
n_heads: 4
lstm_layers: 2
dropout: 0.1

batch_size: 32
epochs: 30
patience: 5
lr: 0.0001
seed: 42

n_features: 7
n_time_features: 4

anomaly_window: 48
anomaly_lam: 3.0
inverse_scale: true
