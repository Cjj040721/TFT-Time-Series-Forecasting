# ── TFT on Weather (WTH), seq=96, pred=24  (Table 12) ─────────────────────────
# Weather: 12 features, target = WetBulbCelsius, hourly

model: tft
dataset: Weather
data_path: data/raw/Weather/WTH.csv
target: WetBulbCelsius
freq: h

seq_len: 96
label_len: 48
pred_len: 24

d_model: 128
n_heads: 4
lstm_layers: 2
dropout: 0.1

batch_size: 32
epochs: 50
patience: 8
lr: 0.0005
seed: 42

n_features: 12
n_time_features: 4   # month day_of_week day_of_month hour

anomaly_window: 48
anomaly_lam: 3.0
inverse_scale: False
