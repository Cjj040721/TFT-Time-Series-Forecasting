# ── LSTM Baseline on ETTm1, seq=96, pred=24  (Table 11) ───────────────────────
# ETTm1 is 15-minute frequency → freq='t', n_time_features=5

model: lstm
dataset: ETTm1
data_path: data/raw/ETT/ETTm1.csv
target: OT
freq: t

seq_len: 96
label_len: 48
pred_len: 24

hidden_size: 256
lstm_layers: 2
dropout: 0.1

batch_size: 32
epochs: 30
patience: 5
lr: 0.001
seed: 42

n_features: 7
n_time_features: 5

anomaly_window: 48
anomaly_lam: 3.0
inverse_scale: false
