# ── LSTM Baseline on ETTh2, seq=96, pred=24  (Table 11) ───────────────────────

model: lstm
dataset: ETTh2
data_path: data/raw/ETT/ETTh2.csv
target: OT
freq: h

seq_len: 96
label_len: 48
pred_len: 24

hidden_size: 256
lstm_layers: 2
dropout: 0.1

batch_size: 32
epochs: 30
patience: 5
lr: 0.001
seed: 42

n_features: 7
n_time_features: 4

anomaly_window: 48
anomaly_lam: 3.0
inverse_scale: false
