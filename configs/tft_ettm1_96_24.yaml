# ── TFT on ETTm1, seq=96, pred=24  (Table 11: cross-dataset comparison) ───────
# ETTm1 is 15-minute frequency → freq='t', n_time_features=5

model: tft
dataset: ETTm1
data_path: data/raw/ETT/ETTm1.csv
target: OT
freq: t

seq_len: 96
label_len: 48
pred_len: 24

d_model: 128
n_heads: 4
lstm_layers: 2
dropout: 0.1

batch_size: 32
epochs: 50
patience: 8
lr: 0.0005
seed: 42

n_features: 7
n_time_features: 5   # month day_of_week day_of_month hour minute

anomaly_window: 48
anomaly_lam: 3.0
inverse_scale: False
